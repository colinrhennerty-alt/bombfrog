[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bombfrog"
version = "0.1.0"
description = "A simple arcade-style game built with pygame."
requires-python = ">=3.12"
dependencies = [
    "pygame==2.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
packages = ["game"]
