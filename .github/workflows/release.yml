name: Release

on:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win64
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller bombfrog.spec

      - name: Get version from pyproject.toml
        shell: bash
        run: |
          BASE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "VERSION=${BASE_VERSION}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Package archive
        shell: python
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          import os
          import shutil

          version = os.environ["VERSION"]
          platform = os.environ["PLATFORM"]
          root_name = "Bomb Frog.app" if platform == "macos" else "bombfrog"
          shutil.make_archive(f"bombfrog-{version}-{platform}", "zip", "dist", root_name)

      - uses: actions/upload-artifact@v4
        with:
          name: bombfrog-${{ env.VERSION }}-${{ matrix.platform }}
          path: bombfrog-${{ env.VERSION }}-${{ matrix.platform }}.zip

      - name: Install butler
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            linux) BUTLER_PLATFORM=linux-amd64 ;;
            win64) BUTLER_PLATFORM=windows-amd64 ;;
            macos) BUTLER_PLATFORM=darwin-amd64 ;;
          esac
          curl -L -o butler.zip "https://broth.itch.zone/butler/${BUTLER_PLATFORM}/LATEST/archive/default"
          unzip butler.zip -d butler-bin
          chmod +x butler-bin/butler || true

      - name: Push build to itch.io
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            BUILD_PATH="dist/Bomb Frog.app"
          else
            BUILD_PATH="dist/bombfrog"
          fi
          ./butler-bin/butler push "$BUILD_PATH" bjorndead/bomb-frog:${{ matrix.platform }} --userversion "$VERSION"
